name: Build iStore OS 6.x

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: 0 16 * * *

env:
  REPO_URL: https://github.com/istoreos/istoreos
  FEEDS_CONF: feeds.conf
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1-6.x.sh
  DIY_P2_SH: diy-part2-6.x.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        REPO_BRANCH:
          - istoreos-24.10
        ARCHITECTURE:
          - armv8
        os:
          - ubuntu-22.04

    steps:

    - name: 合并磁盘
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024

    - name: 准备完成
      uses: actions/checkout@main

    - name: 编译前同步官方 ARMv8 配置
      run: |
        set -e

        mkdir -p ./armv8

        echo "========================================"
        echo "下载官方 feeds.conf"
        echo "========================================"

        wget --no-check-certificate --no-cache \
          -O ./armv8/feeds.conf \
          https://fw0.koolcenter.com/iStoreOS/easepi-r1/feeds.conf

        echo "========================================"
        echo "下载官方 config.buildinfo"
        echo "========================================"

        wget --no-check-certificate --no-cache \
          -O ./armv8/.config \
          https://fw0.koolcenter.com/iStoreOS/easepi-r1/config.buildinfo

        if [ ! -s "./armv8/.config" ]; then
          echo "错误：官方 config.buildinfo 下载失败"
          exit 1
        fi

        if [ ! -s "./armv8/feeds.conf" ]; then
          echo "错误：官方 feeds.conf 下载失败"
          exit 1
        fi

        if [ ! -s "./configfiles/config_data-6.x.txt" ]; then
          echo "错误：configfiles/config_data-6.x.txt 不存在或为空"
          exit 1
        fi

        cp ./armv8/.config ./armv8/.config.official

        python3 <<'PY'
from pathlib import Path
import re

official_file = Path("./armv8/.config")
custom_file = Path("./configfiles/config_data-6.x.txt")

official_lines = official_file.read_text(
    encoding="utf-8",
    errors="ignore"
).splitlines()

custom_lines = custom_file.read_text(
    encoding="utf-8",
    errors="ignore"
).splitlines()

config = {}
order = []

enabled_pattern = re.compile(
    r"^(CONFIG_[A-Za-z0-9_]+)=(.*)$"
)

disabled_pattern = re.compile(
    r"^#\s*(CONFIG_[A-Za-z0-9_]+)\s+is not set$"
)

def process(lines):
    for raw in lines:
        line = raw.strip()

        if not line:
            continue

        match = enabled_pattern.match(line)

        if match:
            symbol = match.group(1)

            if symbol not in config:
                order.append(symbol)

            config[symbol] = line
            continue

        match = disabled_pattern.match(line)

        if match:
            symbol = match.group(1)

            if symbol not in config:
                order.append(symbol)

            config[symbol] = line

process(official_lines)
process(custom_lines)

output = "\n".join(
    config[symbol]
    for symbol in order
) + "\n"

official_file.write_text(
    output,
    encoding="utf-8"
)
PY

        echo "========================================"
        echo "合并后的 Rockchip DEVICE"
        echo "========================================"

        grep \
          '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' \
          ./armv8/.config \
          || true

    - name: 创建工作目录
      run: |
        set -e

        mkdir -p "${GITHUB_WORKSPACE}/workdir"
        chmod 755 "${GITHUB_WORKSPACE}/workdir"

        echo "WORKDIR_PATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

    - name: 检查服务器配置
      run: |
        echo "========================================"
        echo "CPU"
        echo "========================================"

        nproc

        echo "========================================"
        echo "内存"
        echo "========================================"

        free -h

        echo "========================================"
        echo "磁盘"
        echo "========================================"

        df -hT

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e

        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          g++-multilib \
          gettext \
          git \
          libncurses5-dev \
          libssl-dev \
          python3 \
          python3-distutils \
          python3-pip \
          rsync \
          unzip \
          zlib1g-dev \
          file \
          wget \
          curl \
          jq \
          bc \
          swig \
          time

        sudo timedatectl set-timezone "$TZ" || true

        python3 -m pip install --upgrade pip || true
        python3 -m pip install pyelftools || true

        gcc --version
        python3 --version
        make --version

    - name: 克隆源码
      working-directory: ${{ env.WORKDIR_PATH }}/workdir
      run: |
        set -e

        df -hT "$PWD"

        git clone \
          --depth=1 \
          "$REPO_URL" \
          -b "${{ matrix.REPO_BRANCH }}" \
          openwrt

        ln -sf \
          "${{ env.WORKDIR_PATH }}/workdir/openwrt" \
          "$GITHUB_WORKSPACE/openwrt"

        cd openwrt

        git branch
        git log -1 --oneline

    - name: 缓存构建动作
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: ${{ matrix.os }}-${{ matrix.ARCHITECTURE }}-${{ matrix.REPO_BRANCH }}
        prefix: ${{ github.workspace }}/openwrt

    - name: 加载自定义 feeds
      run: |
        set -e

        if [ ! -f "./armv8/feeds.conf" ]; then
          echo "错误：armv8/feeds.conf 不存在"
          exit 1
        fi

        cp \
          ./armv8/feeds.conf \
          ./openwrt/feeds.conf

        chmod +x "$DIY_P1_SH"

        cd openwrt

        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: 更新 feeds
      run: |
        set -e

        cd openwrt

        ./scripts/feeds update -a

    - name: 安装 feeds
      run: |
        set -e

        cd openwrt

        ./scripts/feeds install -a

    - name: 加载自定义配置
      run: |
        set -e

        echo "========================================"
        echo "加载最终配置"
        echo "========================================"

        if [ -e files ]; then
          mv files openwrt/files
        fi

        if [ ! -f "./armv8/.config" ]; then
          echo "错误：armv8/.config 不存在"
          exit 1
        fi

        cp \
          ./armv8/.config \
          ./openwrt/.config

        chmod +x "$DIY_P2_SH"

        cd openwrt

        "$GITHUB_WORKSPACE/$DIY_P2_SH"

        echo "========================================"
        echo "强制锁定 Hinlink OPC-H6XK"
        echo "========================================"

        sed -i \
          '/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$/d' \
          .config

        sed -i \
          '/^# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.* is not set$/d' \
          .config

        sed -i \
          '/^CONFIG_TARGET_rockchip=/d' \
          .config

        sed -i \
          '/^CONFIG_TARGET_rockchip_armv8=/d' \
          .config

        sed -i \
          '/^CONFIG_TARGET_MULTI_PROFILE=/d' \
          .config

        echo 'CONFIG_TARGET_rockchip=y' >> .config
        echo 'CONFIG_TARGET_rockchip_armv8=y' >> .config
        echo 'CONFIG_TARGET_MULTI_PROFILE=y' >> .config

        echo 'CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk=y' >> .config

        echo "========================================"
        echo "强制锁定后的 DEVICE"
        echo "========================================"

        grep \
          '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' \
          .config

    - name: 校验只编译 Hinlink OPC-H6XK
      run: |
        set -e

        cd openwrt

        EXPECTED='CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk=y'

        echo "========================================"
        echo "当前 Rockchip DEVICE"
        echo "========================================"

        grep \
          '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' \
          .config \
          || true

        DEVICE_COUNT=$(grep \
          -c \
          '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' \
          .config || true)

        if [ "$DEVICE_COUNT" -ne 1 ]; then
          echo "错误：发现 $DEVICE_COUNT 个 Rockchip ARMv8 DEVICE"
          exit 1
        fi

        if ! grep -qx "$EXPECTED" .config; then
          echo "错误：唯一 DEVICE 不是 Hinlink OPC-H6XK"
          exit 1
        fi

        echo "========================================"
        echo "✓ DEVICE 校验通过"
        echo "✓ 只允许 Hinlink OPC-H6XK"
        echo "========================================"

    - name: 生成最终配置
      id: defconfig
      run: |
        set -e

        cd openwrt

        echo "========================================"
        echo "执行 make defconfig"
        echo "========================================"

        make defconfig

        echo "========================================"
        echo "defconfig 后 Rockchip DEVICE"
        echo "========================================"

        grep \
          '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' \
          .config \
          || true

    - name: defconfig 后再次校验 H6XK
      run: |
        set -e

        cd openwrt

        EXPECTED='CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk=y'

        DEVICE_COUNT=$(grep \
          -c \
          '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' \
          .config || true)

        echo "========================================"
        echo "defconfig 后 DEVICE 数量：$DEVICE_COUNT"
        echo "========================================"

        grep \
          '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' \
          .config \
          || true

        if [ "$DEVICE_COUNT" -ne 1 ]; then
          echo "错误：defconfig 后存在多个 Rockchip DEVICE"
          echo "重新清理其他 DEVICE"

          sed -i \
            '/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$/d' \
            .config

          sed -i \
            '/^# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.* is not set$/d' \
            .config

          echo "$EXPECTED" >> .config

          make defconfig

          DEVICE_COUNT=$(grep \
            -c \
            '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' \
            .config || true)
        fi

        if [ "$DEVICE_COUNT" -ne 1 ]; then
          echo "错误：最终仍存在多个 Rockchip DEVICE"
          grep \
            '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' \
            .config \
            || true
          exit 1
        fi

        if ! grep -qx "$EXPECTED" .config; then
          echo "错误：最终 DEVICE 不是 H6XK"
          grep \
            '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' \
            .config \
            || true
          exit 1
        fi

        echo "========================================"
        echo "✓ 最终配置确认"
        echo "========================================"

        echo "CONFIG_TARGET_rockchip=y"
        echo "CONFIG_TARGET_rockchip_armv8=y"
        echo "CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk=y"

        echo "========================================"

    - name: 下载软件包
      id: package
      run: |
        set -e

        cd openwrt

        make download -j8

        find dl \
          -size -1024c \
          -exec ls -l {} \;

        find dl \
          -size -1024c \
          -exec rm -f {} \;

    - name: 编译固件
      id: compile
      run: |
        set -e

        cd openwrt

        echo "========================================"
        echo "开始编译 Hinlink OPC-H6XK"
        echo "========================================"

        echo "CPU线程：$(nproc)"

        make -j$(nproc) || \
        make -j1 || \
        make -j1 V=s

        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" \
          >> "$GITHUB_ENV"

        echo "status=success" \
          >> "$GITHUB_OUTPUT"

        echo "========================================"
        echo "✓ Hinlink OPC-H6XK 编译完成"
        echo "========================================"

    - name: 查找ko文件
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt

        echo "========================================"
        echo "KO 文件"
        echo "========================================"

        find . \
          -type f \
          -name "*.ko" \
          | sort

        echo "========================================"
        echo "Rockchip 网络驱动 KO"
        echo "========================================"

        find \
          build_dir/target-*/linux-*/linux-*/drivers/net/ \
          -name "*.ko" \
          2>/dev/null \
          | sort \
          || true

    - name: 检查磁盘空间
      if: (!cancelled())
      run: |
        df -hT

    - name: 上传 bin 文件夹
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: 整理固件文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        set -e

        cd openwrt/bin/targets/*/*

        rm -rf packages

        echo "========================================"
        echo "固件文件"
        echo "========================================"

        find . \
          -maxdepth 1 \
          -type f \
          -print

        echo "FIRMWARE=$PWD" \
          >> "$GITHUB_ENV"

        echo "status=success" \
          >> "$GITHUB_OUTPUT"

    - name: 上传固件目录
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 生成发布标签
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        set -e

        echo "release_tag=$(date +"%Y.%m.%d-%H.%M")-${{ matrix.ARCHITECTURE }}-h6xk" \
          >> "$GITHUB_OUTPUT"

        touch release.txt

        echo "iStoreOS 6.x" >> release.txt
        echo "" >> release.txt

        echo "架构: ${{ matrix.ARCHITECTURE }}" >> release.txt
        echo "设备: Hinlink OPC-H6XK" >> release.txt
        echo "源码: ${{ env.REPO_URL }}" >> release.txt
        echo "分支: ${{ matrix.REPO_BRANCH }}" >> release.txt
        echo "编译时间: $(date +"%Y年%m月%d日 %H时%M分")" >> release.txt
        echo "" >> release.txt

        echo "目标配置：" >> release.txt
        echo "CONFIG_TARGET_rockchip=y" >> release.txt
        echo "CONFIG_TARGET_rockchip_armv8=y" >> release.txt
        echo "CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk=y" >> release.txt
        echo "" >> release.txt

        echo "说明：本版本仅编译 Hinlink OPC-H6XK。" \
          >> release.txt

    - name: 自动发布固件到 Releases
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.release_tag != '' && !cancelled()
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: 删除运行记录
      uses: xiaomeng9597/delete-workflow-runs@main
      if: always()
      with:
        retain_days: 20
        keep_minimum_runs: 15
        token: ${{ env.GITHUB_TOKEN }}

    - name: 删除自动发布的旧固件
      uses: dev-drprasad/delete-older-releases@v0.3.3
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      with:
        keep_latest: 60
        delete_tags: true
