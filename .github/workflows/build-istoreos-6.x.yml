name: Build iStore OS 6.x

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

env:
  REPO_URL: https://github.com/istoreos/istoreos
  FEEDS_CONF: feeds.conf
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1-6.x.sh
  DIY_P2_SH: diy-part2-6.x.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        REPO_BRANCH:
          - istoreos-24.10
        ARCHITECTURE:
          - armv8
        os:
          - ubuntu-22.04

    steps:
      - name: 合并磁盘
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          temp-reserve-mb: 100
          root-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 检出当前仓库
        uses: actions/checkout@main

      - name: 编译前同步官方 ARMv8 配置
        shell: bash
        run: |
          set -e

          mkdir -p ./armv8

          echo "下载官方 feeds.conf..."
          wget -qO "./armv8/${FEEDS_CONF}" \
            "https://fw0.koolcenter.com/iStoreOS/easepi-r1/feeds.conf"

          echo "下载官方 config.buildinfo..."
          wget -qO "./armv8/${CONFIG_FILE}" \
            "https://fw0.koolcenter.com/iStoreOS/easepi-r1/config.buildinfo"

          test -s "./armv8/${FEEDS_CONF}"
          test -s "./armv8/${CONFIG_FILE}"

          cp "./armv8/${CONFIG_FILE}" "./armv8/config.official"

          echo "合并 configfiles/config_data-6.x.txt..."

          python3 - <<'PY'
          from pathlib import Path

          official = Path("./armv8/config.official")
          custom = Path("./configfiles/config_data-6.x.txt")
          output = Path("./armv8/.config")

          official_lines = official.read_text(errors="ignore").splitlines()
          custom_lines = custom.read_text(errors="ignore").splitlines() if custom.exists() else []

          values = {}

          for line in official_lines:
              line = line.strip()
              if line.startswith("CONFIG_") and "=" in line:
                  key = line.split("=", 1)[0]
                  values[key] = line

          for line in custom_lines:
              line = line.strip()
              if line.startswith("CONFIG_") and "=" in line:
                  key = line.split("=", 1)[0]
                  values[key] = line
              elif line.startswith("# CONFIG_") and line.endswith(" is not set"):
                  key = line[2:].split(" ", 1)[0]
                  values[key] = line

          result = []

          seen = set()

          for line in official_lines:
              stripped = line.strip()

              if stripped.startswith("CONFIG_") and "=" in stripped:
                  key = stripped.split("=", 1)[0]
                  if key in values:
                      if key not in seen:
                          result.append(values[key])
                          seen.add(key)
                  continue

              if stripped.startswith("# CONFIG_") and stripped.endswith(" is not set"):
                  key = stripped[2:].split(" ", 1)[0]
                  if key in values:
                      if key not in seen:
                          result.append(values[key])
                          seen.add(key)
                  continue

              result.append(line)

          for line in custom_lines:
              stripped = line.strip()

              if stripped.startswith("CONFIG_") and "=" in stripped:
                  key = stripped.split("=", 1)[0]
                  if key not in seen:
                      result.append(line)
                      seen.add(key)

              elif stripped.startswith("# CONFIG_") and stripped.endswith(" is not set"):
                  key = stripped[2:].split(" ", 1)[0]
                  if key not in seen:
                      result.append(line)
                      seen.add(key)

          output.write_text("\n".join(result) + "\n")

          print("官方配置:", official)
          print("自定义配置:", custom)
          print("最终配置:", output)
          PY

          test -s "./armv8/.config"

      - name: 检查编译环境
        shell: bash
        run: |
          echo "CPU:"
          nproc

          echo "Memory:"
          free -h

          echo "Disk:"
          df -h

      - name: 安装编译依赖
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            python3-dev \
            python3-distutils \
            python3-pip \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            rename \
            xz-utils \
            p7zip-full

          python3 -m pip install --upgrade pip
          python3 -m pip install pyelftools

          sudo timedatectl set-timezone "${TZ}" || true

      - name: 克隆 iStoreOS
        shell: bash
        run: |
          git clone --depth=1 \
            --branch "${{ matrix.REPO_BRANCH }}" \
            "${REPO_URL}" \
            openwrt

      - name: 缓存编译目录
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: true

      - name: 准备 feeds
        shell: bash
        run: |
          set -e

          cp "./armv8/${FEEDS_CONF}" "./openwrt/${FEEDS_CONF}"

          if [ -f "./${DIY_P1_SH}" ]; then
            chmod +x "./${DIY_P1_SH}"
            cd openwrt
            "../${DIY_P1_SH}"
            cd ..
          fi

      - name: 更新并安装 feeds
        shell: bash
        run: |
          set -e

          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 应用配置并锁定 Hinlink OPC-H6XK
        shell: bash
        run: |
          set -e

          cp "./armv8/${CONFIG_FILE}" "./openwrt/${CONFIG_FILE}"

          if [ -d "./files" ]; then
            rm -rf "./openwrt/files"
            cp -a "./files" "./openwrt/files"
          fi

          if [ -f "./${DIY_P2_SH}" ]; then
            chmod +x "./${DIY_P2_SH}"
            cd openwrt
            "../${DIY_P2_SH}"
            cd ..
          fi

          cd openwrt

          echo "清理所有 Rockchip ARMv8 DEVICE..."

          sed -i \
            '/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$/d' \
            .config

          sed -i \
            '/^# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.* is not set$/d' \
            .config

          sed -i \
            '/^CONFIG_TARGET_rockchip=/d' \
            .config

          sed -i \
            '/^CONFIG_TARGET_rockchip_armv8=/d' \
            .config

          sed -i \
            '/^CONFIG_TARGET_MULTI_PROFILE=/d' \
            .config

          cat >> .config <<'EOF'

          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk=y
          EOF

          echo "当前目标配置："
          grep '^CONFIG_TARGET' .config | grep -E 'rockchip|DEVICE' || true

      - name: 锁定目标设备检查
        shell: bash
        run: |
          set -e

          cd openwrt

          echo "检查 make defconfig 前的 DEVICE..."

          devices="$(grep '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' .config || true)"

          echo "${devices}"

          count="$(printf '%s\n' "${devices}" | sed '/^$/d' | wc -l)"

          if [ "${count}" -ne 1 ]; then
            echo "错误：Rockchip ARMv8 DEVICE 数量不是 1"
            exit 1
          fi

          if ! grep -q \
            '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk=y$' \
            .config; then
            echo "错误：不是 Hinlink OPC-H6XK"
            exit 1
          fi

          echo "目标设备检查通过。"

      - name: make defconfig
        shell: bash
        run: |
          set -e

          cd openwrt

          make defconfig

      - name: defconfig 后再次锁定 H6XK
        shell: bash
        run: |
          set -e

          cd openwrt

          echo "检查 make defconfig 后的 DEVICE..."

          devices="$(grep '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' .config || true)"

          echo "${devices}"

          count="$(printf '%s\n' "${devices}" | sed '/^$/d' | wc -l)"

          if [ "${count}" -eq 1 ] && \
             grep -q \
             '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk=y$' \
             .config; then

            echo "H6XK 已正确锁定。"
            exit 0
          fi

          echo "重新强制锁定 Hinlink OPC-H6XK..."

          sed -i \
            '/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$/d' \
            .config

          sed -i \
            '/^# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.* is not set$/d' \
            .config

          sed -i \
            '/^CONFIG_TARGET_rockchip=/d' \
            .config

          sed -i \
            '/^CONFIG_TARGET_rockchip_armv8=/d' \
            .config

          sed -i \
            '/^CONFIG_TARGET_MULTI_PROFILE=/d' \
            .config

          cat >> .config <<'EOF'

          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk=y
          EOF

          make defconfig

          devices="$(grep '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' .config || true)"

          echo "${devices}"

          count="$(printf '%s\n' "${devices}" | sed '/^$/d' | wc -l)"

          if [ "${count}" -ne 1 ]; then
            echo "错误：仍然存在多个 Rockchip ARMv8 DEVICE"
            exit 1
          fi

          if ! grep -q \
            '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk=y$' \
            .config; then
            echo "错误：最终目标不是 Hinlink OPC-H6XK"
            exit 1
          fi

          echo "最终目标确认：Hinlink OPC-H6XK"

      - name: 下载依赖
        shell: bash
        run: |
          set -e

          cd openwrt

          make download -j8

          find dl -type f -size -1k -delete || true

      - name: 编译固件
        shell: bash
        run: |
          set -o pipefail

          cd openwrt

          echo "开始编译 Hinlink OPC-H6XK..."

          make -j"$(nproc)" || \
          make -j1 || \
          make -j1 V=s

          FILE_DATE="$(date +'%Y%m%d-%H%M%S')"
          echo "FILE_DATE=${FILE_DATE}" >> "${GITHUB_ENV}"

      - name: 查找内核模块
        if: always()
        shell: bash
        run: |
          echo "查找 .ko 文件..."

          find openwrt/bin \
            -type f \
            -name '*.ko' \
            -print 2>/dev/null || true

      - name: 上传完整编译目录
        if: env.UPLOAD_BIN_DIR == 'true'
        uses: actions/upload-artifact@main
        with:
          name: iStoreOS-${{ matrix.ARCHITECTURE }}-h6xk-bin
          path: openwrt/bin/
          if-no-files-found: warn
          retention-days: 7

      - name: 整理固件
        if: env.UPLOAD_FIRMWARE == 'true'
        shell: bash
        run: |
          set -e

          TARGET_DIR="$(find openwrt/bin/targets \
            -mindepth 2 \
            -maxdepth 2 \
            -type d \
            | head -n 1)"

          if [ -z "${TARGET_DIR}" ]; then
            echo "错误：没有找到固件目标目录"
            find openwrt/bin/targets -maxdepth 3 -type d || true
            exit 1
          fi

          echo "固件目录：${TARGET_DIR}"

          cd "${TARGET_DIR}"

          rm -rf packages

          find . \
            -maxdepth 1 \
            -type f \
            ! -name '*.img.gz' \
            -delete

          if ! find . \
            -maxdepth 1 \
            -type f \
            -name '*.img.gz' \
            -print \
            -quit | grep -q .; then

            echo "错误：没有找到 img.gz 固件"
            ls -lah
            exit 1
          fi

          echo "FIRMWARE=${PWD}" >> "${GITHUB_ENV}"

          echo "最终固件："
          ls -lah

      - name: 上传固件
        if: env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@main
        with:
          name: iStoreOS-${{ matrix.ARCHITECTURE }}-hinlink-opc-h6xk
          path: ${{ env.FIRMWARE }}/*
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        if: env.UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iStoreOS-${{ matrix.REPO_BRANCH }}-${{ matrix.ARCHITECTURE }}-h6xk-${{ env.FILE_DATE }}
          name: iStoreOS ${{ matrix.REPO_BRANCH }} ${{ matrix.ARCHITECTURE }} Hinlink OPC-H6XK ${{ env.FILE_DATE }}
          body: |
            ## iStoreOS 6.x

            - 架构：${{ matrix.ARCHITECTURE }}
            - 分支：${{ matrix.REPO_BRANCH }}
            - 设备：Hinlink OPC-H6XK
            - 构建时间：${{ env.FILE_DATE }}

            ### Target

            ```text
            CONFIG_TARGET_rockchip=y
            CONFIG_TARGET_rockchip_armv8=y
            CONFIG_TARGET_MULTI_PROFILE=y
            CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk=y
            ```

            本次编译已强制清除其他 Rockchip ARMv8 DEVICE，仅编译 Hinlink OPC-H6XK。
          files: |
            ${{ env.FIRMWARE }}/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: 删除旧 Workflow Runs
        if: always()
        uses: xiaomeng9597/delete-workflow-runs@main
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          retain_days: 0
          keep_minimum_runs: 5

      - name: 删除旧 Releases
        if: always()
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 60
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
